<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marevia Jewelry Catalog</title>

    <link rel="icon" type="image/png" href="assets/icon.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <header>

        <div class="banner">
            <img src="assets/banner.png" alt="Marevia Jewelry">
        </div>

    </header>

    <div class="toolbar">

        <div id="categories">

            <button class="active" data-category="All">Tümü</button>
            <button data-category="Earrings">Küpeler</button>
            <button data-category="Necklaces">Kolyeler</button>
            <button data-category="Bracelets">Bileklikler</button>
            <button data-category="Hand-Chains">Şahmeran</button>
            <button data-category="Anklets">Halhal</button>

        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
                id="search"
                type="text"
                placeholder="Ürünleri ara..."
                autocomplete="off"
            >
        </div>

    </div>

    <main id="products">

        <!-- Ürünler script.js tarafından oluşturulacak -->

    </main>

    <!-- LIGHTBOX -->

    <div id="lightbox">

        <span id="close">&times;</span>

        <button id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button id="next">&#10095;</button>
        
        <div class="lightbox-counter"></div>

    </div>

    <script src="script.js" defer></script>

</body>

</html>

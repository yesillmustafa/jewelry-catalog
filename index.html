<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marevia Jewelry Catalog</title>

    <link rel="icon" type="image/png" href="assets/icon.png">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <header>

        <div class="banner">
            <img src="assets/banner.png" alt="Marevia Jewelry">
        </div>

    </header>

    <div class="toolbar">

        <div id="categories">

            <button class="active">Tümü</button>
            <button>Küpe</button>
            <button>Kolye</button>
            <button>Bileklik</button>
            <button>Şahmeran</button>
            <button>Halhal</button>

        </div>

        <input
            id="search"
            type="text"
            placeholder="🔍 Ürünleri ara..."
        >

    </div>

    <main id="products">

        <!-- Ürünler script.js tarafından oluşturulacak -->

    </main>

    <!-- LIGHTBOX -->

    <div id="lightbox">

        <span id="close">&times;</span>

        <button id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button id="next">&#10095;</button>
        
        <div class="lightbox-counter"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
